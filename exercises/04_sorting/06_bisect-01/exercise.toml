id = "bisect-01"
title = "Search Insert Position"
module = "sorting"
difficulty = "intermediate"
type = "syntax"
concepts = ["bisect", "bisect_left", "binary search"]

description = """
Implement search_insert(nums, target).

nums is sorted in ascending order and contains distinct integers. If target is
in nums, return its index. Otherwise return the index where target would be
inserted to keep nums sorted. Return 0 for an empty list.

Use bisect.bisect_left instead of writing the binary search by hand.
"""

objective = "Use bisect.bisect_left to find the leftmost insertion point in a sorted list."

interview = """
Search Insert Position is the textbook binary search, and the same lookup sits
inside Longest Increasing Subsequence, Time Based Key-Value Store and many
"first element >= x" questions. bisect_left gives a correct, O(log n) answer
in one call with no off-by-one risk; interviewers usually accept it unless
they explicitly ask you to hand-roll the loop.
"""

hints = [
  "The standard library already has a binary search that returns insertion points.",
  "bisect_left(nums, target) returns the first index i where nums[i] >= target.",
  "That index is the answer in both cases: return bisect_left(nums, target).",
]

[[examples]]
input = "search_insert([1, 3, 5, 6], 5)"
output = "2"
explanation = "5 is in the list at index 2, and bisect_left returns the index of an existing value."

[[examples]]
input = "search_insert([1, 3, 5, 6], 7)"
output = "4"
explanation = "7 is larger than every element, so it goes past the end, at index len(nums) = 4."

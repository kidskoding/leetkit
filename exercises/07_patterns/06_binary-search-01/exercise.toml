id = "binary-search-01"
title = "Find the First Broken Build"
module = "patterns"
difficulty = "intermediate"
type = "application"
concepts = ["binary search", "predicates", "first true"]

description = """
Implement first_bad_build(n, is_bad).

Builds are numbered 1 to n. is_bad(b) returns True if build b is broken. Once a
build is broken, every later build is broken too, so is_bad is False, False,
..., True, True across 1..n.

Return the number of the first broken build, or -1 if no build is broken
(including when n is 0). Only call is_bad on builds 1..n, and use binary search:
about log2(n) calls, not one per build.
"""

objective = "Binary search on a monotonic predicate to find the first True."

interview = """
First Bad Version, Koko Eating Bananas, shipping capacity, and integer square
root are all "binary search on the answer": a yes/no check that flips once.
A half-open lo/hi loop that converges on the first True avoids the classic
off-by-one and infinite-loop bugs.
"""

hints = [
  "Keep a range [lo, hi) that always contains the answer, where hi = n + 1 means 'no bad build'.",
  "Loop while lo < hi with mid = (lo + hi) // 2.",
  "If is_bad(mid), the answer is at mid or earlier: hi = mid. Otherwise lo = mid + 1. At the end, lo is the answer if lo <= n.",
]

[[examples]]
input = "first_bad_build(5, lambda b: b >= 4)"
output = "4"
explanation = "Builds 1-3 pass and builds 4-5 fail, so the first broken build is 4."

[[examples]]
input = "first_bad_build(3, lambda b: False)"
output = "-1"
explanation = "No build is broken, so the search ends past build n and the answer is -1."

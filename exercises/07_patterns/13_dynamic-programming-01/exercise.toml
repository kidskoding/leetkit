id = "dynamic-programming-01"
title = "Fewest Coins for Exact Change"
module = "patterns"
difficulty = "advanced"
type = "application"
concepts = ["dynamic programming", "bottom-up table", "functools.lru_cache", "math.inf"]

description = """
Implement min_coins(coins, amount).

coins is a list of distinct positive coin values and you have an unlimited
supply of each. amount is a non-negative integer. Return the smallest number
of coins whose values add up to exactly amount, or -1 if no combination works.

Return 0 when amount is 0 (no coins needed), even if coins is empty. Greedy
"largest coin first" is not always optimal. Fill a bottom-up list where entry
a holds the fewest coins for amount a, using math.inf for "not reachable yet",
or write a top-down recursion memoised with functools.lru_cache.
"""

objective = "Solve an unbounded-knapsack minimum with a bottom-up DP list (or lru_cache) and math.inf as the unreachable sentinel."

interview = """
Coin Change is the textbook DP question, and the same table shape solves
Perfect Squares, Minimum Cost for Tickets, and Word Break. Interviewers want
the recurrence (best[a] = 1 + min over coins of best[a - coin]), a clear
sentinel for impossible amounts, and an explanation of why greedy fails.
"""

hints = [
  "The best answer for amount a is 1 plus the best answer for a - coin, minimised over every coin that fits.",
  "Start with best = [0] + [math.inf] * amount, then fill a from 1 to amount in increasing order.",
  "For each a and each coin <= a, set best[a] = min(best[a], best[a - coin] + 1). Return -1 if best[amount] is still math.inf, else best[amount].",
]

[[examples]]
input = "min_coins([1, 2, 5], 11)"
output = "3"
explanation = "5 + 5 + 1 = 11 uses three coins, and no two coins can reach 11."

[[examples]]
input = "min_coins([1, 3, 4], 6)"
output = "2"
explanation = "Greedy would take 4 + 1 + 1, but 3 + 3 reaches 6 with only two coins."

[[examples]]
input = "min_coins([2], 3)"
output = "-1"
explanation = "Only even totals are reachable with 2-value coins, so 3 is impossible."

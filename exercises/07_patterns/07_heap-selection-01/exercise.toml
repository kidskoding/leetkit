id = "heap-selection-01"
title = "Nearest Restaurants to Home"
module = "patterns"
difficulty = "intermediate"
type = "application"
concepts = ["heapq", "nsmallest", "key functions", "top-k"]

description = """
Implement nearest_restaurants(points, k).

points is a list of (x, y) integer tuples giving restaurant locations; home is
at (0, 0). Return a list of the k points closest to home by Euclidean distance,
ordered closest first. Points at equal distance keep their input order.

If k is 0 return []. If k is at least len(points), return all points in that
order. Return the original tuples. Use heapq.nsmallest(k, points, key=...) with
the squared distance x * x + y * y as the key.
"""

objective = "Select the top k items by a computed key with heapq.nsmallest()."

interview = """
K Closest Points to Origin, top k frequent elements, and kth largest element are
heap-selection problems. heapq.nsmallest and heapq.nlargest give an O(n log k)
answer in one line with a key function, and comparing squared distances avoids
square roots and floating-point ties.
"""

hints = [
  "You only need the k best points, ranked by distance from (0, 0).",
  "heapq.nsmallest(k, iterable, key=...) returns the k smallest items, smallest first.",
  "Pass key=lambda p: p[0] * p[0] + p[1] * p[1]; nsmallest keeps input order for equal keys.",
]

[[examples]]
input = "nearest_restaurants([(1, 3), (-2, 2)], 1)"
output = "[(-2, 2)]"
explanation = "Squared distances are 10 and 8, so (-2, 2) is closer."

[[examples]]
input = "nearest_restaurants([(3, 3), (5, -1), (-2, 4)], 2)"
output = "[(3, 3), (-2, 4)]"
explanation = "Squared distances are 18, 26, and 20, so the two closest are (3, 3) then (-2, 4)."

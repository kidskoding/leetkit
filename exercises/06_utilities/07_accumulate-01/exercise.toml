id = "accumulate-01"
title = "Range Sum Queries"
module = "utilities"
difficulty = "intermediate"
type = "syntax"
concepts = ["itertools.accumulate", "prefix sums"]

description = """
Implement range_sums(nums, queries).

queries is a list of (left, right) pairs of inclusive indices into nums,
with 0 <= left <= right < len(nums). Return a list with the sum of
nums[left..right] for each query, in query order. Return [] when there are no
queries.

Build a prefix-sum list once with itertools.accumulate (use initial=0), then
answer each query in O(1).
"""

objective = "Build prefix sums with itertools.accumulate and answer range queries by subtraction."

interview = """
Prefix sums turn repeated range-sum questions from O(n) each into O(1) each.
They power Range Sum Query, Subarray Sum Equals K, and Product of Array Except
Self. itertools.accumulate builds the prefix array in one line instead of a
hand-written running-total loop.
"""

hints = [
  "If prefix[i] is the sum of the first i numbers, then sum(nums[l..r]) == prefix[r + 1] - prefix[l].",
  "list(accumulate(nums, initial=0)) gives [0, nums[0], nums[0] + nums[1], ...].",
  "Return [prefix[r + 1] - prefix[l] for l, r in queries].",
]

[[examples]]
input = "range_sums([2, 4, 1, 3], [(0, 1), (1, 3), (2, 2)])"
output = "[6, 8, 1]"
explanation = "The prefix sums are [0, 2, 6, 7, 10], so the answers are 6 - 0 = 6, 10 - 2 = 8, and 7 - 6 = 1."

[[examples]]
input = "range_sums([5, -2, 7], [(0, 0), (0, 2)])"
output = "[5, 10]"
explanation = "A range with left == right is just that one element (5), and negatives are summed normally: 5 - 2 + 7 = 10."

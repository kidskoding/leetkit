id = "consecutive-01"
title = "Longest Consecutive Sequence"
module = "hashing"
difficulty = "intermediate"
type = "application"
concepts = ["set", "membership", "sequence starts"]

description = """
Implement longest_consecutive(nums).

nums is an unsorted list of integers (possibly negative, possibly repeated).
Return the length of the longest run of consecutive integer values, such as
4, 5, 6, 7, that all appear in nums. The values may appear in any order in the
list, and duplicates count once. Return 0 for an empty list.

Solve it in O(n) without sorting: put the numbers in a set and only start
counting from a number whose predecessor (num - 1) is not in the set.
"""

objective = "Use a set to find run starts and count each run once in O(n)."

interview = """
This is LeetCode's Longest Consecutive Sequence, a classic follow-up to
"can you beat O(n log n) sorting?". Counting upward from every number is
O(n^2) on a long run; the trick is that only a run's smallest value has no
predecessor in the set, so each run is walked exactly once. Explaining why the
nested while loop is still O(n) overall is what interviewers listen for.
"""

hints = [
  "You need fast answers to \"is x present?\" for arbitrary x.",
  "A number starts a run only if num - 1 is not in the set; from there, count num + 1, num + 2, ...",
  "Loop over the set; when num - 1 not in num_set, walk while num + length in num_set and keep the best length.",
]

[[examples]]
input = "longest_consecutive([100, 4, 200, 1, 3, 2])"
output = "4"
explanation = "1, 2, 3 and 4 are all present, a run of 4. 100 and 200 are runs of length 1."

[[examples]]
input = "longest_consecutive([1, 2, 2, 3])"
output = "3"
explanation = "The duplicate 2 counts once, so the run is 1, 2, 3 with length 3."

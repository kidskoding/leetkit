version: 2

project_name: leetkit

before:
  hooks:
    - go mod tidy
    - mkdir -p completions
    - sh -c 'for sh in bash zsh fish; do go run . completion "$sh" > "completions/leetkit.$sh"; done'

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
